# nginx.conf: static distribution channel for get.simtabi.com
#
# Goals:
#  - Serve identical bytes to every User-Agent (the curl|sh trust model
#    requires this: see docs/security.md).
#  - HSTS + strict TLS via the reverse-proxy / CF tunnel that sits in
#    front of this nginx. nginx itself terminates plain HTTP on 80.
#  - Aggressive caching for immutable per-version artefacts.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to stdout/stderr so supervisor + the container runtime
    # collect them.
    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # Hide nginx version on every response.
    server_tokens off;

    # Plain-text MIME types for the installer payloads.
    types {
        application/x-sh           sh;
        application/x-powershell   ps1;
        text/x-python              py;
        application/json           json sha256;
    }

    # Identical bytes regardless of UA. We do NOT vary on User-Agent,
    # which is the textbook curl|sh attack vector
    # (https://www.idontplaydarts.com/2016/04/...).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /srv/www;

        # Security headers (defense-in-depth; CF tunnel adds its own too)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Immutable versioned files cache for a year
        location ~* ^/[^/]+/[0-9]+\.[0-9]+\.[0-9]+/.*$ {
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            try_files $uri =404;
        }

        # Latest-version aliases: short TTL so updates propagate quickly
        location / {
            expires 5m;
            add_header Cache-Control "public, max-age=300, must-revalidate";
            try_files $uri $uri/ =404;
        }

        # Tiny health endpoint
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
