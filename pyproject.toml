[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "get-installer"
version = "0.3.0"
description = "Reusable, registry-driven curl-pipe-sh-style installer for distributing dev tools across public, private, enterprise, and government contexts."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Simtabi LLC", email = "opensource@simtabi.com" }]
keywords = [
  "installer",
  "curl-bash",
  "bootstrap",
  "one-liner-installer",
  "distribution-channel",
  "pipx",
  "uv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Software Distribution",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-mock>=3.14",
  "ruff>=0.9",
  "mypy>=1.13",
]

[project.scripts]
get-installer = "get_installer.__main__:main"

[project.urls]
Homepage      = "https://opensource.simtabi.com/products/get-installer"
Documentation = "https://opensource.simtabi.com/documentation/get-installer"
Repository    = "https://github.com/simtabi/get-installer"
Issues        = "https://github.com/simtabi/get-installer/issues"
Changelog     = "https://github.com/simtabi/get-installer/blob/main/CHANGELOG.md"
DistroChannel = "https://get.simtabi.com"

[tool.hatch.build.targets.wheel]
packages = ["src/get_installer"]

[tool.hatch.build.targets.wheel.force-include]
"src/get_installer/py.typed" = "get_installer/py.typed"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/get_installer"]
